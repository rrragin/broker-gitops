apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# deploy.yaml is a pinned copy of the upstream operator manifest
# (SolaceProducts/pubsubplus-kubernetes-quickstart, deploy/deploy.yaml).
# It creates the pubsubplus-operator-system namespace, the CRD, RBAC and the
# operator Deployment (image solace/pubsubplus-eventbroker-operator:1.4.2).
# To upgrade the operator: replace deploy.yaml, review the diff, merge.
resources:
  - deploy.yaml
