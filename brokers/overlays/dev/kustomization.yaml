apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: PubSubPlusEventBroker
      name: solace-broker
    patch: |-
      - op: replace
        path: /spec/redundancy
        value: false
      - op: add
        path: /spec/developer
        value: true
