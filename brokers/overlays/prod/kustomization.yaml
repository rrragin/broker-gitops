apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: PubSubPlusEventBroker
      name: solace-broker
    patch: |-
      - op: replace
        path: /spec/redundancy
        value: true
      - op: add
        path: /spec/storage
        value:
          messagingNodeStorageSize: 30Gi
          # useStorageClass: <your-storage-class>
      - op: add
        path: /spec/podDisruptionBudgetForHA
        value: true
      # Protect the broker and its data from accidental removal in Git / Argo CD:
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
